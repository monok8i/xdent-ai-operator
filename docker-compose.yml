networks:
  xdent-network:
    name: xdent-network
    driver: bridge

services:
  xdent-api:
    image: xdent-api:latest
    container_name: xdent-api
    build:
      context: ./backend
      dockerfile: api.Dockerfile
    restart: no
    env_file:
      - .env

    environment:
      HF_TOKEN: ${HF_TOKEN}
      HF_HUB_DISABLE_XET: "1"
      HF_HOME: /root/.cache/huggingface

    ports:
      - "${API_PORT}:${API_PORT}"

    volumes:
      - ./backend/src/:/app/src/
      - ./backend/main.py:/app/main.py
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/migrations/:/app/migrations/
      - huggingface-cache:/root/.cache/huggingface

    networks:
      - xdent-network

    depends_on:
      xdent-db:
        condition: service_healthy

  xdent-mcp:
    image: xdent-mcp:latest
    container_name: xdent-mcp
    build:
      context: ./backend
      dockerfile: mcp.Dockerfile
    restart: no
    env_file:
      - .env

    environment:
      HF_TOKEN: ${HF_TOKEN}
      HF_HUB_DISABLE_XET: "1"
      HF_HOME: /root/.cache/huggingface

    ports:
      - "${MCP_PORT:-8001}:8001"

    volumes:
      - ./backend/src/:/app/src/
      - ./backend/main.py:/app/main.py
      - huggingface-cache:/root/.cache/huggingface

    networks:
      - xdent-network

    depends_on:
      xdent-db:
        condition: service_healthy

  xdent-frontend:
    image: xdent-frontend:latest
    container_name: xdent-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://xdent-api:${API_PORT:-8000}
    restart: no
    env_file:
      - .env

    environment:
      NEXT_PUBLIC_API_URL: http://xdent-api:${API_PORT:-8000}
      PORT: 3000
      HOSTNAME: 0.0.0.0

    ports:
      - "${FRONTEND_PORT:-3000}:3000"

    networks:
      - xdent-network

    depends_on:
      xdent-api:
        condition: service_started

  xdent-db:
    image: pgvector/pgvector:0.6.0-pg16
    container_name: xdent-db
    restart: no
    env_file:
      - .env

    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready --username=${POSTGRES_USER} --dbname=${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 5

    networks:
      - xdent-network

volumes:
  huggingface-cache:
